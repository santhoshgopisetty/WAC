<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Chat Vault</title>
    <!-- Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app-container">
        <!-- Join Screen -->
        <div id="join-screen" class="screen active">
            <div class="glass-panel">
                <div class="header">
                    <div class="logo-icon">🔒</div>
                    <h1>CipherChat</h1>
                    <p>Enter a secret code to join a private room.</p>
                </div>
                <form id="join-form">
                    <div class="input-group">
                        <label for="username">Display Name</label>
                        <input type="text" id="username" placeholder="Anonymous" required autocomplete="off">
                    </div>
                    <div class="input-group">
                        <label for="room-code">Secret Code</label>
                        <input type="password" id="room-code" placeholder="e.g. secure123" required autocomplete="off">
                    </div>
                    <button type="submit" class="btn-primary">Enter Vault</button>
                </form>
            </div>

            <!-- Animated Background Elements -->
            <div class="bg-shape shape-1"></div>
            <div class="bg-shape shape-2"></div>
            <div class="bg-shape shape-3"></div>
        </div>

        <!-- Chat Screen -->
        <div id="chat-screen" class="screen">
            <div class="chat-container glass-panel">
                <div class="chat-header">
                    <div class="room-info">
                        <h2>Room: <span id="current-room"></span></h2>
                        <span class="status-indicator"></span><span class="status-text">Connected</span>
                    </div>
                    <button id="leave-btn" class="btn-secondary">Leave</button>
                </div>

                <div class="chat-messages" id="messages-container">
                    <!-- Messages will be injected here dynamically -->
                    <div class="system-message">Welcome to the secret vault. Messages are not stored permanently.</div>
                </div>

                <div class="chat-input-area">
                    <form id="chat-form">
                        <input type="text" id="message-input" placeholder="Type a message..." required
                            autocomplete="off">
                        <button type="submit" class="btn-send">
                            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2"
                                fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Socket.IO Client Script (served by the backend) -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>

</html>
